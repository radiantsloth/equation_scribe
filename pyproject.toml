[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equation-scribe"
version = "0.0.1"
description = "Human-in-the-loop technical paper reader: PDF ingest + LaTeX validator"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Team Spangler"}]
dependencies = [
    "pillow",
    "pdfplumber",
    "pymupdf",
    "sympy==1.14.0",
    "antlr4-python3-runtime==4.11",
]

[project.optional-dependencies]
dev = [
    "black",
    "numpy",
    "opencv-python",
    "portalocker>=2.8.0",
    "pytest",
    "rapidfuzz>=2.0.0",
    "tqdm",
    "gradio",
]

[tool.setuptools.packages.find]
where = [".", "packages/core/src"]
